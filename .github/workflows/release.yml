# Builds the one-click Windows installer on every version tag (v1.0.0, v1.0.1, ...)
# and publishes it as a GitHub Release. Permanent download link:
#   https://github.com/<owner>/<repo>/releases/latest/download/PureLab-Setup.exe
name: Release Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          # Optional code signing: add these repository secrets to remove the SmartScreen warning.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: softprops/action-gh-release@v2
        with:
          files: release/PureLab-Setup.exe
          generate_release_notes: true
          make_latest: true
